name: Discord merge notification
on:
  pull_request:
    types: [closed]

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ github.event.pull_request.html_url }}
          COMMITS_URL: ${{ github.event.pull_request.commits_url }}
        run: |
          commits=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$COMMITS_URL?per_page=100" \
            | jq -r '.[] | "• `\(.sha[0:7])` \(.commit.message | split("\n")[0])"' \
            | head -c 3800)
          jq -n --arg title "Merged: #$NUMBER $TITLE" --arg url "$URL" --arg desc "$commits" \
            '{embeds:[{title:($title|.[0:256]), url:$url, description:$desc, color:5763719}],
              allowed_mentions:{parse:[]}}' \
          | curl -s -H "Content-Type: application/json" -d @- "$WEBHOOK"