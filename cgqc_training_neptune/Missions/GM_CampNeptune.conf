 m_sAuthor "Grey & silent1"
 m_sDescription "Le Camp Neptune est l'installation principale du 10e Régiment de Rangers — un complexe d'entraînement complet conçu pour le développement individuel, en escouade et en peloton. Des fondamentaux du tir sur les champs de tir au combat en petites unités sur les zones d'entraînement dédiées, le Camp Neptune fournit les installations et la structure pour amener les Rangers du niveau débutant jusqu'à l'aptitude opérationnelle. Que vous soyez une nouvelle recrue passant ses qualifications de base ou un opérateur chevronné dirigeant des exercices d'assaut en peloton, l'entraînement ne s'arrête jamais au Camp Neptune."
 m_bIsArmavisionAllowedInMP 1
}