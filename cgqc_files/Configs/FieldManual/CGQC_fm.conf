SCR_FieldManualConfigCategory {
 m_sTitle "CGQC — Journal Opérationnel"
 m_aCategories {
  SCR_FieldManualConfigCategory "{691C42B6B0947A10}" {
   m_sTitle "Organisation"
   m_aEntries {
    SCR_FieldManualConfigEntry_Standard "{691C42B6B0947A63}" {
     m_bEnabled 1
     m_sTitle "Présentation et Mandat"
     m_Image "{362FD2B78C35AF08}UI/FieldManual/UI_fm_cgqc_logo.edds"
     m_aContent {
      SCR_FieldManualPiece_Header "{691C42B6B0947A4A}" {
       m_sText "CGQC — Corps de Garde de Québec"
      }
      SCR_FieldManualPiece_Text "{691C42B6B0947A9B}" {
       m_sText "Le CGQC est une organisation para-militaire privée à contrat d'État — ni tout à fait une force armée conventionnelle, ni un simple PMC mercenaire. Officiellement, il opère sous mandat gouvernemental québécois, mais avec une autonomie opérationnelle suffisante pour agir là où les forces régulières ne peuvent pas — ou ne veulent pas — mettre les pieds."
      }
      SCR_FieldManualPiece_Separator "{691C42B6B0947AAD}" {
       m_iPaddingTop 5
       m_iPaddingBottom 5
      }
      SCR_FieldManualPiece_Text "{691C42B5E779B85D}" {
       m_sText "Le CGQC intervient dans des zones de conflits étrangers, des opérations de sécurité sensibles, et des missions de stabilisation que les canaux diplomatiques officiels ne peuvent pas assumer publiquement. Ils font aussi de la formation, du renseignement terrain, et de l'extraction de personnel en zone hostile."
      }
      SCR_FieldManualPiece_Separator "{691C42B5EFC9BBA8}" {
      }
     }
    }
    SCR_FieldManualConfigEntry_Standard "{691C42B6B0947AF4}" {
     m_bEnabled 1
     m_sTitle "Structure et Grades"
     m_Image "{2045E9FAC759DAB2}UI/Textures/FieldManual/MPModes/Conflict/Tiles/FM_HQC_CoC_UI.edds"
     m_aContent {
      SCR_FieldManualPiece_Header "{691C42B6B0947AE2}" {
       m_sText "Les Grades"
      }
      SCR_FieldManualPiece_Text "{691C42B6B0947AC6}" {
       m_sText "Les rangs sont surtout un indicateur de votre progression et de votre implication dans le groupe. C'est organisé surtout pour guider votre focus sur les points importants avant de rentrer dans les systèmes plus complexes.  Ça reste très flexible. Vous allez être appelé à jouer des rôles \"plus bas\" que votre rang, tout le monde joue simple rifleman parfois...  Mais vous aller aussi  avoir une promotion temporaire à l'occasion afin de jouer un rôle spécifique. Il va sans dire que c'est une occasion idéale pour démontrer vos capacités."
      }
      SCR_FieldManualPiece_Separator "{691C42B6B0947AD2}" {
       m_iPaddingTop 10
       m_iPaddingBottom 10
      }
     }
    }
    SCR_FieldManualConfigEntry_Standard "{691C42B6B0947B35}" {
     m_bEnabled 1
     m_sTitle "Doctrine Opérationnelle"
     m_Image "{3D2CF73BBEA2F0E1}UI/Textures/FieldManual/MPModes/Conflict/Tiles/seizing_base_UI.edds"
     m_aContent {
      SCR_FieldManualPiece_Header "{691C42B6B0947B25}" {
       m_sText "Doctrine Opérationelle"
      }
      SCR_FieldManualPiece_Text "{691C42B6B0947B1B}" {
       m_sText "Le CGQC n'opère pas selon un manuel de doctrine fixe. Chaque mission est adaptée au contexte. Les procédures standard existent, mais l'initiative individuelle et le jugement situationnel priment sur la rigidité hiérarchique. Sur le terrain, la chaîne de commandement est fonctionnelle mais pas protocolaire : elle suit les rôles assumés sur le moment."
      }
      SCR_FieldManualPiece_Separator "{691C42B6B0947B16}" {
       m_iPaddingTop 5
       m_iPaddingBottom 5
      }
      SCR_FieldManualPiece_Text "{691C42B3A8FF3A8B}" {
       m_sText "Les membres du CGQC sont formés à opérer en petits éléments autonomes, à maintenir la discrétion opérationnelle, et à s'adapter aux règles d'engagement variables selon le mandat en cours."
      }
     }
    }
    SCR_FieldManualConfigEntry_Standard "{691C42B3F4890B43}" {
     m_bEnabled 1
     m_sTitle "Unité de Préparation Opérationnelle"
     m_Image "{1D44E81AB47BB209}UI/Textures/FieldManual/MPModes/Conflict/Tiles/FM_HQC_Squadleaders_UI.edds"
     m_aContent {
      SCR_FieldManualPiece_Header "{691C42B3F4890BC7}" {
       m_sText "Cellule d'entraînement continu"
      }
      SCR_FieldManualPiece_Text "{691C42B3F4890BCF}" {
       m_sText "L'Unité de Préparation Opérationnelle (UPO) est la cellule de formation interne du CGQC. Elle est responsable de qualifier les membres avant déploiement opérationnel, mais aussi de maintenir les capacités déjà aquises."
      }
      SCR_FieldManualPiece_LineBreak "{691C42B0C231FC3A}" {
      }
      SCR_FieldManualPiece_Text "{691C42B0B9BB8A61}" {
       m_sText "L'UPO opère depuis deux installations distinctes : l'Aigle Noir, un complexe souterrain à accès restreint servant de centre de formation technique et d'évaluation, et le Camp Lacorne, un site d'entraînement extérieur isolé utilisé pour les exercices tactiques terrain."
      }
     }
    }
   }
  }
